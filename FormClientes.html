 <div class="form-container">
    <form id="fvalida" action="recibe.php" method="post">
      <h2>Formulario de Opinión</h2>

      <label class="form-label">Nombre:</label>
      <input type="text" name="nombre" class="form-control" required>

      <label class="form-label">Desde donde nos visitas:</label>
      <input type="text" name="visitas" class="form-control" required>

      <label class="form-label">¿Volverías a visitar el lugar?</label>
      <input type="text" name="lugar" class="form-control" required>

      <label class="form-label">¿Qué te parecieron nuestros servicios?</label>
      <select name="servicios" class="form-control" required>
        <option value="">Elegir</option>
        <option value="Buenos">Buenos</option>
        <option value="Malos">Malos</option>
        <option value="Más o Menos">Más o Menos</option>
      </select>

      <label class="form-label">¿Estás satisfecho con el lugar?</label>
      <select name="opinion" class="form-control" required>
        <option value="">Elegir</option>
        <option value="Sí">Sí</option>
        <option value="No">No</option>
      </select>

      <label class="form-label">¿Qué experiencia te llevas?</label>
      <input type="text" name="experiencia" class="form-control">

      <label class="form-label">Sugerencias para mejorar:</label>
      <input type="text" name="sugerencias" class="form-control">

      <button type="submit" class="btn btn-custom">Enviar</button>
    </form>
  </div>
      

    <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("fvalida");

      form.addEventListener("submit", (e) => {
        const nombre = form.nombre.value.trim();
        const visitas = form.visitas.value.trim();
        const lugar = form.lugar.value.trim();
        const servicios = form.servicios.value.trim();
        const opinion = form.opinion.value.trim();
        const experiencia = form.experiencia.value.trim();
        const sugerencias = form.sugerencias.value.trim();

        let mensaje = "";

        if (nombre === "") mensaje += "• Nombre\n";
        if (visitas === "") mensaje += "• Visitas\n";
        if (lugar === "") mensaje += "• Lugar\n";
        if (servicios === "") mensaje += "• Servicios\n";
        if (opinion === "") mensaje += "• Opinión\n";
        if (experiencia === "") mensaje += "• Experiencia\n";
        if (sugerencias === "") mensaje += "• Sugerencias\n";

        if (mensaje !== "") {
          alert("Por favor, completa los siguientes campos:\n\n" + mensaje);
          e.preventDefault();
        } else {
          alert("Gracias por completar la encuesta.");
        }
      });
    });
  </script>
